services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: todo_app
    ports:
      - '5434:5432'
    volumes:
      - todo_app_pg_data:/var/lib/postgresql/data

volumes:
  todo_app_pg_data:
